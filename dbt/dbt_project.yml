name: cascadia_controltower
version: "1.0.0"
config-version: 2

profile: cascadia_controltower

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Staging is a thin, typed view over the frozen star schema. Marts are tables,
# because the static page reads them at build time and a table is what a
# reader can inspect without a query engine.
models:
  cascadia_controltower:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
